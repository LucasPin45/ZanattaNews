name: Telegram News Bot

on:
  schedule:
    # Notícias a cada 15 minutos
    - cron: "*/15 * * * *"
    # Pauta da Câmara às 7h BRT (10h UTC), dias úteis
    - cron: "0 10 * * 1-5"
    # Resumo diário às 20h BRT (23h UTC)
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de execução'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - summary
          - pauta
          - dou
      hours:
        description: 'Horas para buscar (só modo normal)'
        required: false
        default: '8'
        type: string

concurrency:
  group: newsbot
  # false: uma rodada em andamento termina em vez de ser cancelada no meio
  # (cancelar no meio fazia notícias já enviadas serem reenviadas depois)
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine run mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_HOURS: ${{ github.event.inputs.hours }}
        run: |
          # O modo vem do agendamento que disparou a rodada (não do minuto em que
          # ela começou): o GitHub atrasa execuções, e o horário podia ser "perdido".
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            MODE="${INPUT_MODE:-normal}"
            HOURS="${INPUT_HOURS:-8}"
          else
            case "$SCHEDULE" in
              "0 23 * * *")   MODE="summary" ;;
              "0 10 * * 1-5") MODE="pauta" ;;
              *)              MODE="normal" ;;
            esac
            HOURS="8"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "hours=$HOURS" >> "$GITHUB_OUTPUT"
          echo "Modo: $MODE (agendamento: ${SCHEDULE:-manual})"

      - name: Run bot
        id: bot
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ steps.mode.outputs.mode }}
          HOURS: ${{ steps.mode.outputs.hours }}
        run: |
          case "$MODE" in
            summary) python telegram_news_bot.py --summary ;;
            pauta)   python telegram_news_bot.py --pauta ;;
            dou)     python telegram_news_bot.py --dou ;;
            *)       python telegram_news_bot.py --hours "$HOURS" ;;
          esac

      - name: Notify failure
        if: steps.bot.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=⚠️ <b>Newsbot falhou!</b>%0A%0AMode: ${MODE}%0A🔗 <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Ver logs</a>" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

      - name: Commit state (db/xlsx)
        if: always()
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"

          git add sent_items.db 'historico_news*.xlsx' || true

          if git diff --cached --quiet; then
            echo "✅ Nenhuma alteração"
            exit 0
          fi

          git commit -m "chore: update newsbot state [skip ci]"

          # se alguém publicou algo no meio da rodada, integra antes de enviar
          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            echo "Tentativa $i de salvar o estado falhou; repetindo..."
            sleep 5
          done
          exit 1

      - name: Fail job if bot failed
        if: steps.bot.outcome == 'failure'
        run: exit 1
